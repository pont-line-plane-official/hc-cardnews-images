# 하트커넥트 댓글 → 자동 DM
#
# 원본: heart-connect-docs/marketing/content_engine/deploy/dm_workflow.yml
# 여기서 고치지 말고 원본을 고친 뒤 `node src/deploy_schedule.mjs` 로 배포할 것.
#
# 🔴 발송(비공개 답장)은 앱 심사 없이 된다(2026-08-21 실측).
#    답장 읽기·팔로우 확인은 고급 액세스가 필요해 현재 1단계 모드로 돈다.
name: dm bot

# 🔴 2026-08-21 — **크론 중단.** 자동 DM 은 **리틀리(litt.ly)** 로 운영한다.
#    둘 다 돌면 한 사람이 DM 을 두 통 받는다. 되살릴 때는 **리틀리를 먼저 끄고** 아래 주석을 푼다.
#    자체 발송이 실제로 되는 것은 2026-08-21 실측으로 확인됨(APP_REVIEW.md).
on:
  # schedule:
  #   - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: '발송하지 않고 무엇을 보낼지만 확인'
        type: boolean
        default: false

permissions:
  contents: write           # 발송 기록(state.json)을 커밋하기 위해 필요

concurrency:
  group: dm-bot             # 중복 실행 = 중복 발송. 반드시 막는다
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 폴링
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_PAGE_ID: ${{ secrets.IG_PAGE_ID }}
          DM_SALT: ${{ secrets.DM_SALT }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python3 dmbot/dm_bot.py --run --dry
          else
            python3 dmbot/dm_bot.py --run
          fi

      - name: 발송 기록 커밋
        run: |
          if [ -n "$(git status --porcelain dmbot/state.json)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dmbot/state.json
            git commit -m "dm: 발송 기록 $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi
